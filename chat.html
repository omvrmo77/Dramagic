<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Dramagic | Chat</title>
<script>
    (function () {
      let theme = "light";

      try {
        const settings = JSON.parse(localStorage.getItem("dramagic_settings")) || {};
        theme = settings.theme || localStorage.getItem("dramagic_theme") || "light";
      } catch {
        theme = localStorage.getItem("dramagic_theme") || "light";
      }

      const systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      const useDark = theme === "dark" || (theme === "system" && systemDark);

      document.documentElement.classList.toggle("dark-mode", useDark);
      document.documentElement.classList.toggle("light-mode", !useDark);
    })();
  </script>
<link href="dramagic-global-settings.css" rel="stylesheet"/>
<link href="chat.css" rel="stylesheet"/><link href="dramagic-nav.css" rel="stylesheet"/>
<!-- Dramagic PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<meta name="theme-color" content="#08a9d9" />
<meta name="application-name" content="Dramagic" />
<meta name="apple-mobile-web-app-title" content="Dramagic" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body class="chat-page"><div id="dramagicGlobalNav"></div>
<main aria-label="Dramagic professional chat workspace" class="chat-app">

<aside aria-label="Chats sidebar" class="chat-sidebar">
<header class="sidebar-header">
<div class="sidebar-brand">
<img alt="Dramagic" src="dramagic-logo.png"/>
<div>
<strong>Chat</strong>
<span id="sidebarRoleText">Channels &amp; private messages</span>
</div>
</div>
<button aria-label="Close chats panel" class="sidebar-dismiss-btn" id="sidebarDismissBtn" type="button">
          ×
        </button>
</header>
<section aria-label="Signed in profile" class="sidebar-user-card">
<img alt="Profile picture" id="sidebarUserAvatar" src=""/>
<div>
<strong id="sidebarUserName">Loading...</strong>
<span id="sidebarUserRole">Loading...</span>
</div>
</section>
<section aria-label="Chat controls" class="sidebar-controls">
<label aria-label="Search chats" class="chat-search-box">
<span>⌕</span>
<input id="classSearchInput" placeholder="Search" type="search"/>
</label>
<button class="new-chat-btn" id="newPrivateChatBtn" type="button">
          New chat
        </button>
</section>
<div aria-label="Chat filters" class="chat-tabs-row">
<button class="mini-tab active" data-chat-filter="channels" type="button">Channels</button>
<button class="mini-tab" data-chat-filter="private" type="button">Chats</button>
<button class="mini-tab" data-chat-filter="homework-templates" type="button">Missions</button>
</div>
<section aria-label="Choose a Dramagician for private chat" class="student-picker-panel hidden" id="studentPickerPanel">
<header>
<div>
<strong>Start a private chat</strong>
<span>Choose a Dramagician</span>
</div>
<button aria-label="Close private chat picker" id="closeStudentPickerBtn" type="button">×</button>
</header>
<label aria-label="Search Dramagicians" class="student-picker-search">
<span>⌕</span>
<input id="studentSearchInput" placeholder="Name or class" type="search"/>
</label>
<div class="student-picker-list" id="studentPickerList"></div>
</section>
<nav aria-label="Choose chat" class="class-list" id="classList"></nav>
</aside>
<button aria-label="Close chats panel" class="mobile-sidebar-overlay" id="mobileSidebarOverlay" type="button"></button>
<section aria-label="Opened chat" class="chat-room">
<header class="chat-room-header">
<button aria-label="Open chats panel" class="mobile-sidebar-btn" id="mobileSidebarBtn" type="button">
          ☰
        </button>
<div class="active-class-avatar" id="activeClassIcon">A</div>
<div class="chat-title-box">
<strong id="chatTitle">Class A Channel</strong>
<span id="chatSubtitle">Teacher/CEO view • class group channel</span>
</div>
<div class="chat-header-actions">
<span class="chat-mode-pill" id="chatModePill">Channel</span>
<a class="chat-video-link" href="#" id="chatHomeworkVideo" rel="noopener" target="_blank">
            Watch clip
          </a>
</div>
</header>
<section class="chat-homework-card" id="chatHomeworkCard">
<div>
<span class="chat-task-label">Pinned assignment</span>
<h3 id="chatHomeworkTitle">Voice Acting Task</h3>
<p id="chatHomeworkText">Loading task...</p>
</div>
</section>
<main aria-live="polite" class="chat-messages" id="chatMessages"></main>
<section aria-label="Emoji picker" class="emoji-picker hidden" id="emojiPicker">
<button type="button">😀</button>
<button type="button">😂</button>
<button type="button">👏</button>
<button type="button">🎭</button>
<button type="button">⭐</button>
<button type="button">🔥</button>
<button type="button">💙</button>
<button type="button">✅</button>
<button type="button">🙌</button>
<button type="button">🎤</button>
</section>
<div class="recording-bar hidden" id="recordingBar">
<span class="recording-dot"></span>
<strong>Recording voice note...</strong>
<span id="recordingTimer">0:00</span>
</div>
<footer class="chat-composer">
<button aria-label="Open emojis" class="chat-tool-btn" id="emojiBtn" type="button">
          😊
        </button>
<textarea aria-label="Write a message" id="chatInput" placeholder="Type a message" rows="1"></textarea>
<button aria-label="Record voice note" class="chat-tool-btn mic-btn" id="recordVoiceBtn" type="button">
          🎙️
        </button>
<button aria-label="Stop recording" class="chat-tool-btn stop-btn hidden" id="stopVoiceBtn" type="button">
          ■
        </button>
<button aria-label="Send message" class="chat-send-btn" id="sendChatBtn" type="button">
          ➤
        </button>
</footer>
</section>

</main>
<script defer="" src="dramagic-settings-loader.js"></script>
<script defer="True" src="dramagic-nav.js"></script><script defer="" src="chat.js"></script>
<script defer src="pwa-register.js"></script>
</body>
</html>
