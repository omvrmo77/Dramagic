<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Dramagic in Light Mode...</title>
</head>
<body>
  <script>
    const saved = JSON.parse(localStorage.getItem("dramagic_settings") || "{}");
    saved.theme = "light";
    localStorage.setItem("dramagic_settings", JSON.stringify(saved));
    localStorage.setItem("dramagic_theme", "light");
    window.location.href = "index.html";
  </script>
</body>
</html>
