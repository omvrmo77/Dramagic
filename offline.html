<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dramagic | Offline</title>
<style>
    :root { --blue:#08a9d9; --deep:#007aa7; --bg:#e6f9ff; --ink:#10202a; --muted:#5f7280; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family: Arial, sans-serif; color:var(--ink); background: radial-gradient(circle at top, rgba(8,169,217,.22), transparent 360px), var(--bg); }
    .card { width:min(520px,100%); padding:28px; border-radius:30px; background:rgba(255,255,255,.94); box-shadow:0 24px 70px rgba(0,122,167,.16); text-align:center; }
    img { width:96px; height:96px; object-fit:contain; margin-bottom:14px; }
    h1 { margin:0 0 10px; font-size:clamp(28px,7vw,44px); }
    p { margin:0 0 20px; color:var(--muted); line-height:1.6; font-weight:700; }
    a, button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 18px; border-radius:999px; border:0; background:linear-gradient(135deg,var(--deep),var(--blue)); color:white; font-weight:900; text-decoration:none; cursor:pointer; }
  </style>
<!-- Dramagic PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<meta name="theme-color" content="#08a9d9" />
<meta name="application-name" content="Dramagic" />
<meta name="apple-mobile-web-app-title" content="Dramagic" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
</head>
<body>
  <main class="card">
    <img src="assets/icons/icon-192.png" alt="Dramagic" />
    <h1>You are offline</h1>
    <p>Dramagic is installed, but this page needs internet the first time it opens. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
    <a href="index.html">Open Home</a>
  </main>
<script defer src="pwa-register.js"></script>
</body>
</html>
